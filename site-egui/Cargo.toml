[package]
name = "site-egui"
version = "0.1.0"
edition = "2021"
description = "egui/eframe chess playground — static WASM alternative to the Astro site"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Reused native crates — no JS/WIT/Component-Model boundary.
chess-engine = { path = "../chess-engine", default-features = false }
smart-bot = { path = "../bots/smart-bot", default-features = false }

eframe = { version = "0.31", default-features = false, features = [
    "glow",          # WebGL2 renderer (smaller than wgpu)
    "default_fonts",
] }
egui = "0.31"

# wasm-bindgen MUST match the nixpkgs wasm-bindgen-cli version exactly (0.2.121).
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Document", "Window", "Location", "HtmlCanvasElement", "Storage",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"     # optimize for size (smaller wasm)
lto = true
codegen-units = 1
panic = "abort"
strip = true
