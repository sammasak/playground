name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Install Playwright browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (Playwright)
        working-directory: site
        run: npx playwright test

      - name: Fetch BitNet model from release and chunk into the site
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/bitnet/model
          gh release download bitnet-model-v1 --repo "${{ github.repository }}" \
            --pattern ggml-model-q8embd.gguf --output model.gguf
          ( cd dist/bitnet/model
            split -b 90m -d -a 3 ../../../model.gguf chunk-
            for f in chunk-[0-9]*; do mv "$f" "$f.gguf"; done
            total=$(stat -c%s ../../../model.gguf)
            chunks=$(ls chunk-*.gguf | sort | sed 's/.*/"&"/' | paste -sd,)
            sizes=$(ls chunk-*.gguf | sort | xargs -r stat -c%s | paste -sd,)
            printf '{"chunks":[%s],"sizes":[%s],"bytes":%s}\n' "$chunks" "$sizes" "$total" > manifest.json
            cat manifest.json )
          rm model.gguf
          du -sh dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
